# Publish dsh-skillbox to npm with Trusted Publishing (OIDC) — no NPM_TOKEN, nothing to expire.
# One-time setup: npm → Package → Settings → Trusted Publisher → GitHub Actions
#   organization/user: BB0027   repository: dsh-skillbox   workflow: publish.yml   environment: (empty)
# See docs/PUBLISHING.md.

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Report tool versions and registry
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Refuse to publish when a token is configured
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::a token is configured; remove it so publishing uses Trusted Publishing (OIDC)"
            exit 1
          fi
          echo "no token configured"

      - name: Show OIDC environment
        run: |
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset}"
          echo "GITHUB_WORKFLOW_REF=${GITHUB_WORKFLOW_REF:-unset}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "OIDC_REQUEST_URL=present"; else echo "OIDC_REQUEST_URL=ABSENT"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC_REQUEST_TOKEN=present"; else echo "OIDC_REQUEST_TOKEN=ABSENT"; fi
          echo "provenance=$(npm config get provenance)"
          echo "registry=$(npm config get registry)"

      - name: Publish
        run: npm publish --access public --provenance

      - name: npm debug log on failure
        if: failure()
        run: |
          f="$(ls -t "$HOME"/.npm/_logs/*debug-0.log 2>/dev/null | head -1)"
          if [ -z "$f" ]; then echo "no debug log found"; exit 0; fi
          echo "--- log: $f ---"
          grep -i -E 'oidc|provenance|auth|token|trusted' "$f" | tail -50
